# ==============================================================================
# StockSense Continuous Integration (CI) Workflow
# ==============================================================================
# Hey team! This GitHub Actions pipeline automatically checks pull requests to ensure:
#   1. Backend and Frontend packages install cleanly.
#   2. Code passes lint checks.
#   3. Test suites execute successfully before merging into main.
# ==============================================================================

name: StockSense CI Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install backend dependencies
        run: |
          cd backend
          npm ci

      - name: Run backend tests
        run: |
          cd backend
          npm test --if-present

  frontend-test:
    name: Frontend Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v3

      - name: Setup Node.js environment
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Vite bundle
        run: |
          cd frontend
          npm run build
